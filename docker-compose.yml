version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: disasterintel-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - APP_NAME=DisasterIntel
      - APP_ENV=production
      - API_VERSION=v1
      - DATABASE_URL=sqlite:///./disasterintel.db
      - CORS_ORIGINS=["*"]
    volumes:
      - ./data:/app/data
      - ./ml/artifacts:/app/ml/artifacts
      - backend-db:/app
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 15s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: disasterintel-frontend
    restart: unless-stopped
    ports:
      - "80:80"
      - "5173:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  backend-db:
